name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/netra-cctv-website-3k3gxh, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Remove dynamic API routes (incompatible with output:export)
        run: |
          rm -rf "src/app/api/admin/enquiries/[id]"
          rm -rf "src/app/api/auth"
          rm -rf "src/app/api/portfolio/[id]"
          rm -rf "src/app/api/products/[id]"
          rm -rf "src/app/api/leads/export"
          rm -rf "src/app/api/admin/analytics"

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "true"
          DATABASE_URL: "postgresql://dummy:dummy@localhost/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost/dummy"
          NEXTAUTH_SECRET: "github-pages-preview-secret"
          NEXTAUTH_URL: "https://ersid111.github.io/Netracctv"
          ADMIN_EMAIL: "admin@netracctv.com"
          ADMIN_PASSWORD: "Admin@Netra2024"
          NEXT_PUBLIC_WHATSAPP_NUMBER: "919876543210"
          NEXT_PUBLIC_COMPANY_NAME: "NETRA CCTV"
          NEXT_PUBLIC_COMPANY_PHONE: "+91 98765 43210"
          NEXT_PUBLIC_COMPANY_EMAIL: "info@netracctv.com"
          NEXT_PUBLIC_COMPANY_ADDRESS: "Mumbai, Maharashtra, India"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
